<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img"><title>Keep home time close.</title><desc>Static illustration. A home region and a target region arranged vertically. Example times are not live readings. The tool does not change system time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#80aac0" stroke-width="1.8"/></marker></defs><g font-family="Segoe UI,Arial,Microsoft YaHei,sans-serif"><rect x="1" y="1" width="1438" height="658" rx="28" fill="#fcf9f2" stroke="#e8e1d5"/><circle cx="52" cy="48" r="19" fill="#4e9bc0"/><text x="52" y="54" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">03</text><text x="83" y="54" font-size="16" fill="#69818e" font-weight="700">TWO-ZONE CLOCK</text><text x="34" y="108" font-size="36" fill="#223d55" font-weight="700">Two places. One glance.</text><rect x="1100" y="32" width="302" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="1114" y="55" font-size="15" fill="#365f74" font-weight="600">ILLUSTRATED WORKFLOW</text><rect x="35" y="151" width="528" height="352" rx="22" fill="#fff" stroke="#d8e7ec"/><text x="63" y="195" font-size="26" fill="#223d55" font-weight="600">Your original / home region</text><rect x="63" y="217" width="472" height="60" rx="12" fill="#eef7fb" stroke="#d8e7ec"/><text x="82" y="255" font-size="24" fill="#223d55" font-weight="400">Singapore  ·  UTC+08:00</text><text x="63" y="322" font-size="26" fill="#223d55" font-weight="600">Your target region</text><rect x="63" y="344" width="472" height="60" rx="12" fill="#f1eefe" stroke="#e2daf5"/><text x="82" y="382" font-size="24" fill="#223d55" font-weight="400">New York  ·  Eastern Time</text><text x="64" y="458" font-size="20" fill="#69818e" font-weight="400">Search in the selector. Save your regions.</text><path d="M587 325H654V325" stroke="#80aac0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="688" y="151" width="336" height="352" rx="24" fill="#f7f8ff" stroke="#cbd8ef"/><g transform="translate(709,171) scale(0.6)"><path d="M7 33C6 3 53-7 74 20C84 26 91 13 98 17C101 35 88 48 75 43C54 65 13 60 7 33Z" fill="#93d5eb" stroke="#4c86a3" stroke-width="3"/><path d="M13 43Q43 33 67 49Q35 63 13 43" fill="#fffaf0"/><circle cx="30" cy="30" r="4" fill="#243d54"/><ellipse cx="22" cy="38" rx="7" ry="4" fill="#f5b7c5"/><path d="M37 8Q38-6 31-7M38 8Q44-3 49-3" fill="none" stroke="#93d5eb" stroke-width="4" stroke-linecap="round"/></g><text x="783" y="190" font-size="23" fill="#223d55" font-weight="700">Whalegirl Clock</text><text x="783" y="215" font-size="15" fill="#69818e" font-weight="400">Two places, one day</text><rect x="704" y="238" width="304" height="114" rx="15" fill="#fff8e5" stroke="#efe6ca"/><text x="725" y="268" font-size="15" fill="#8b7c58" font-weight="700">HOME · SINGAPORE</text><text x="725" y="315" font-size="42" fill="#335e86" font-weight="600">1:40 PM</text><text x="725" y="339" font-size="13" fill="#8b7c58" font-weight="400">NOV 01 · SUN</text><rect x="704" y="366" width="304" height="114" rx="15" fill="#efecff" stroke="#ddd4f3"/><text x="725" y="396" font-size="15" fill="#7c74a0" font-weight="700">TARGET · NEW YORK</text><text x="725" y="443" font-size="42" fill="#5e5591" font-weight="600">1:40 AM</text><text x="725" y="467" font-size="13" fill="#7c74a0" font-weight="400">NOV 01 · SUN</text><text x="1065" y="220" font-size="26" fill="#223d55" font-weight="700">Make it yours</text><text x="1065" y="274" font-size="22" fill="#223d55" font-weight="400">English / 中文</text><text x="1065" y="315" font-size="22" fill="#223d55" font-weight="400">12- or 24-hour time</text><text x="1065" y="356" font-size="22" fill="#223d55" font-weight="400">Show seconds</text><text x="1065" y="397" font-size="22" fill="#223d55" font-weight="400">Keep on top</text><text x="1065" y="438" font-size="22" fill="#223d55" font-weight="400">Drag into a corner</text><circle cx="53" cy="554" r="19" fill="#4e9bc0"/><text x="53" y="560" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">1</text><text x="85" y="561" font-size="23" fill="#223d55" font-weight="600">Search your regions</text><circle cx="529" cy="554" r="19" fill="#4e9bc0"/><text x="529" y="560" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">2</text><text x="561" y="561" font-size="23" fill="#223d55" font-weight="600">Save your display</text><circle cx="1008" cy="554" r="19" fill="#4e9bc0"/><text x="1008" y="560" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">3</text><text x="1040" y="561" font-size="23" fill="#223d55" font-weight="600">Keep home in view</text><text x="35" y="620" font-size="17" fill="#69818e" font-weight="400">Example times only · Works offline · Uses Windows daylight saving rules · Never changes your system timezone</text></g></svg>
