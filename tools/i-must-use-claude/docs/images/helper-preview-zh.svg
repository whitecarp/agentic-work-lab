<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img"><title>先测清楚，再动设置。</title><desc>大肥鱼环境助手预览版的静态流程示意图：先检测浏览器报告，备份后处理本机命中项，再复测对比；可撤回，不虚构分数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#80aac0" stroke-width="1.8"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Hiragino Sans GB,Noto Sans SC,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1438" height="658" rx="28" fill="#fcf9f2" stroke="#e8e1d5"/><circle cx="52" cy="48" r="19" fill="#4e9bc0"/><text x="52" y="54" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">01</text><text x="83" y="54" font-size="16" fill="#69818e" font-weight="700">大肥鱼环境助手 · 预览版</text><text x="34" y="108" font-size="36" fill="#223d55" font-weight="700">有基准，有备份，有退路。</text><rect x="1286" y="32" width="116" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="1344" y="55" text-anchor="middle" font-size="15" fill="#365f74" font-weight="600">流程示意图</text><rect x="35" y="154" width="419" height="345" rx="22" fill="#fff" stroke="#d8e7ec"/><rect x="55" y="177" width="379" height="34" rx="17" fill="#eaf5fa" stroke="#eaf5fa"/><text x="69" y="200" font-size="15" fill="#597080" font-weight="600">先看实际报告</text><text x="57" y="252" font-size="27" fill="#223d55" font-weight="700">先测清楚</text><text x="57" y="300" font-size="19" fill="#597080" font-weight="400">打开本机测量页面。</text><text x="57" y="337" font-size="19" fill="#597080" font-weight="400">在浏览器里点「开始测量」。</text><text x="57" y="374" font-size="19" fill="#597080" font-weight="400">测不到的就记为未知。</text><rect x="57" y="425" width="375" height="47" rx="23" fill="#4e9bc0" stroke="#4e9bc0"/><text x="244" y="455" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">开始检测</text><rect x="510" y="154" width="419" height="345" rx="22" fill="#fff" stroke="#d8e7ec"/><rect x="530" y="177" width="379" height="34" rx="17" fill="#fff2e6" stroke="#fff2e6"/><text x="544" y="200" font-size="15" fill="#597080" font-weight="600">改动前先备份</text><text x="532" y="252" font-size="27" fill="#223d55" font-weight="700">处理本机命中项</text><text x="532" y="300" font-size="19" fill="#597080" font-weight="400">先看测量结果。</text><text x="532" y="337" font-size="19" fill="#597080" font-weight="400">优化前先退出相关程序。</text><text x="532" y="374" font-size="19" fill="#597080" font-weight="400">只改受支持的命中项。</text><rect x="532" y="425" width="375" height="47" rx="23" fill="#4e9bc0" stroke="#4e9bc0"/><text x="719" y="455" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">一键优化</text><rect x="985" y="154" width="419" height="345" rx="22" fill="#fff" stroke="#d8e7ec"/><rect x="1005" y="177" width="379" height="34" rx="17" fill="#efecfa" stroke="#efecfa"/><text x="1019" y="200" font-size="15" fill="#597080" font-weight="600">对比真实结果</text><text x="1007" y="252" font-size="27" fill="#223d55" font-weight="700">再测一次</text><text x="1007" y="300" font-size="19" fill="#597080" font-weight="400">用同一个浏览器和个人资料。</text><text x="1007" y="337" font-size="19" fill="#597080" font-weight="400">对照前后两次结果。</text><text x="1007" y="374" font-size="19" fill="#597080" font-weight="400">想恢复时可撤回上次优化。</text><rect x="1007" y="425" width="375" height="47" rx="23" fill="#4e9bc0" stroke="#4e9bc0"/><text x="1194" y="455" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">复测结果</text><path d="M464 321H492V321" stroke="#80aac0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M939 321H967V321" stroke="#80aac0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="529" width="1369" height="62" rx="15" fill="#eef5f5" stroke="#dce9e6"/><text x="59" y="568" font-size="19" fill="#436a71" font-weight="700">撤回上次优化</text><text x="214" y="568" font-size="21" fill="#597080" font-weight="400">恢复备份的设置；之后发生冲突的修改会保留并提示。</text><text x="35" y="624" font-size="17" fill="#69818e" font-weight="400">仅示意流程 · 不虚构示例分数 · 浏览器启发式检测，不代表 Claude 账号资格 · 「一键优化」不改网络设置</text></g></svg>
