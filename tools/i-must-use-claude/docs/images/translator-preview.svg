<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img"><title>Select once. Understand it in your language.</title><desc>Static workflow illustration, not a live app screenshot. Choose the Claude window, select a passage, and view its translation. Sample content.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#80aac0" stroke-width="1.8"/></marker></defs><g font-family="Segoe UI,Arial,Microsoft YaHei,sans-serif"><rect x="1" y="1" width="1438" height="658" rx="28" fill="#fcf9f2" stroke="#e8e1d5"/><circle cx="52" cy="48" r="19" fill="#4e9bc0"/><text x="52" y="54" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">02</text><text x="83" y="54" font-size="16" fill="#69818e" font-weight="700">WHALE TRANSLATOR</text><text x="34" y="108" font-size="36" fill="#223d55" font-weight="700">Less copying. More understanding.</text><rect x="1100" y="32" width="302" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="1114" y="55" font-size="15" fill="#365f74" font-weight="600">ILLUSTRATED WORKFLOW</text><rect x="34" y="145" width="565" height="360" rx="20" fill="#18232c" stroke="#18232c"/><text x="60" y="180" font-size="21" fill="#dbe7ee" font-weight="600">Your chosen Claude window</text><circle cx="562" cy="173" r="5" fill="#8abccf"/><text x="60" y="229" font-size="19" fill="#a7bdca" font-weight="400">Select only the passage you need.</text><rect x="58" y="256" width="514" height="104" rx="8" fill="#315585" stroke="#315585"/><text x="75" y="294" font-size="26" fill="#fff" font-weight="600">Could you explain this step</text><text x="75" y="330" font-size="26" fill="#fff" font-weight="600">in plain language?</text><path d="M525 343L526 384L537 372L546 392L555 388L546 368L563 367Z" fill="#fff" stroke="#15212d" stroke-width="2"/><rect x="58" y="428" width="342" height="34" rx="17" fill="#263947" stroke="#263947"/><text x="72" y="451" font-size="15" fill="#c8d9e2" font-weight="600">Selections in other windows stay out.</text><path d="M621 322H691V322" stroke="#80aac0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="716" y="145" width="690" height="360" rx="22" fill="#fff" stroke="#d8e7ec"/><g transform="translate(741,167) scale(0.66)"><path d="M7 33C6 3 53-7 74 20C84 26 91 13 98 17C101 35 88 48 75 43C54 65 13 60 7 33Z" fill="#93d5eb" stroke="#4c86a3" stroke-width="3"/><path d="M13 43Q43 33 67 49Q35 63 13 43" fill="#fffaf0"/><circle cx="30" cy="30" r="4" fill="#243d54"/><ellipse cx="22" cy="38" rx="7" ry="4" fill="#f5b7c5"/><path d="M37 8Q38-6 31-7M38 8Q44-3 49-3" fill="none" stroke="#93d5eb" stroke-width="4" stroke-linecap="round"/></g><text x="820" y="197" font-size="25" fill="#223d55" font-weight="700">Whale Translator</text><rect x="1121" y="167" width="258" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="1135" y="190" font-size="15" fill="#365f74" font-weight="600">Target: Simplified Chinese</text><rect x="744" y="231" width="633" height="105" rx="14" fill="#eef7fb" stroke="#d5e8f0"/><text x="764" y="263" font-size="14" fill="#69818e" font-weight="700">TRANSLATION</text><text x="764" y="306" font-size="28" fill="#223d55" font-weight="400">你能用简单易懂的话解释这一步吗？</text><text x="746" y="378" font-size="16" fill="#69818e" font-weight="400">Original selection</text><text x="746" y="413" font-size="21" fill="#223d55" font-weight="400">Could you explain this step in plain language?</text><rect x="744" y="449" width="198" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="758" y="472" font-size="15" fill="#365f74" font-weight="600">Auto-detect source</text><rect x="957" y="449" width="218" height="34" rx="17" fill="#f4e9df" stroke="#f4e9df"/><text x="971" y="472" font-size="15" fill="#866044" font-weight="600">Optional offline packs</text><rect x="1190" y="449" width="187" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="1204" y="472" font-size="15" fill="#365f74" font-weight="600">Review → copy</text><circle cx="53" cy="554" r="19" fill="#4e9bc0"/><text x="53" y="560" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">1</text><text x="85" y="561" font-size="23" fill="#223d55" font-weight="600">Choose a window</text><circle cx="529" cy="554" r="19" fill="#4e9bc0"/><text x="529" y="560" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">2</text><text x="561" y="561" font-size="23" fill="#223d55" font-weight="600">Select and release</text><circle cx="1008" cy="554" r="19" fill="#4e9bc0"/><text x="1008" y="560" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">3</text><text x="1040" y="561" font-size="23" fill="#223d55" font-weight="600">Read the translation</text><text x="35" y="620" font-size="17" fill="#69818e" font-weight="400">Illustration with sample text · Online: selected text goes to Google · Offline: install a language pack first</text></g></svg>
