<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img"><title>Measure before making changes.</title><desc>Static workflow illustration for the Environment Helper preview. Measure browser signals, back up and optimize matched local settings, then measure again. Undo available, no assumed score.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#80aac0" stroke-width="1.8"/></marker></defs><g font-family="Segoe UI,Arial,Microsoft YaHei,sans-serif"><rect x="1" y="1" width="1438" height="658" rx="28" fill="#fcf9f2" stroke="#e8e1d5"/><circle cx="52" cy="48" r="19" fill="#4e9bc0"/><text x="52" y="54" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">01</text><text x="83" y="54" font-size="16" fill="#69818e" font-weight="700">ENVIRONMENT HELPER · PREVIEW</text><text x="34" y="108" font-size="36" fill="#223d55" font-weight="700">A baseline. A backup. A way back.</text><rect x="1100" y="32" width="302" height="34" rx="17" fill="#e2f0f5" stroke="#e2f0f5"/><text x="1114" y="55" font-size="15" fill="#365f74" font-weight="600">ILLUSTRATED WORKFLOW</text><rect x="35" y="154" width="419" height="345" rx="22" fill="#fff" stroke="#d8e7ec"/><rect x="55" y="177" width="379" height="34" rx="17" fill="#eaf5fa" stroke="#eaf5fa"/><text x="69" y="200" font-size="15" fill="#597080" font-weight="600">SEE WHAT IS REPORTED</text><text x="57" y="252" font-size="27" fill="#223d55" font-weight="700">Measure first</text><text x="57" y="300" font-size="19" fill="#597080" font-weight="400">Open the local measurement page.</text><text x="57" y="337" font-size="19" fill="#597080" font-weight="400">Start the check in your browser.</text><text x="57" y="374" font-size="19" fill="#597080" font-weight="400">Unknown stays unknown.</text><rect x="57" y="425" width="375" height="47" rx="23" fill="#4e9bc0" stroke="#4e9bc0"/><text x="244" y="455" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">Measure first</text><rect x="510" y="154" width="419" height="345" rx="22" fill="#fff" stroke="#d8e7ec"/><rect x="530" y="177" width="379" height="34" rx="17" fill="#fff2e6" stroke="#fff2e6"/><text x="544" y="200" font-size="15" fill="#597080" font-weight="600">BACK UP BEFORE CHANGES</text><text x="532" y="252" font-size="27" fill="#223d55" font-weight="700">Handle local matches</text><text x="532" y="300" font-size="19" fill="#597080" font-weight="400">Review the measured results.</text><text x="532" y="337" font-size="19" fill="#597080" font-weight="400">Close apps before optimizing.</text><text x="532" y="374" font-size="19" fill="#597080" font-weight="400">Only supported matches change.</text><rect x="532" y="425" width="375" height="47" rx="23" fill="#4e9bc0" stroke="#4e9bc0"/><text x="719" y="455" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">Optimize</text><rect x="985" y="154" width="419" height="345" rx="22" fill="#fff" stroke="#d8e7ec"/><rect x="1005" y="177" width="379" height="34" rx="17" fill="#efecfa" stroke="#efecfa"/><text x="1019" y="200" font-size="15" fill="#597080" font-weight="600">COMPARE REAL RESULTS</text><text x="1007" y="252" font-size="27" fill="#223d55" font-weight="700">Measure again</text><text x="1007" y="300" font-size="19" fill="#597080" font-weight="400">Use the same browser and profile.</text><text x="1007" y="337" font-size="19" fill="#597080" font-weight="400">Check the before / after results.</text><text x="1007" y="374" font-size="19" fill="#597080" font-weight="400">Undo the previous optimization.</text><rect x="1007" y="425" width="375" height="47" rx="23" fill="#4e9bc0" stroke="#4e9bc0"/><text x="1194" y="455" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">Measure after</text><path d="M464 321H492V321" stroke="#80aac0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M939 321H967V321" stroke="#80aac0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="529" width="1369" height="62" rx="15" fill="#eef5f5" stroke="#dce9e6"/><text x="59" y="568" font-size="19" fill="#436a71" font-weight="700">UNDO LAST OPTIMIZATION</text><text x="400" y="568" font-size="21" fill="#597080" font-weight="400">Restore backed-up values; conflicting later edits are retained and reported.</text><text x="35" y="624" font-size="17" fill="#69818e" font-weight="400">Workflow only · No sample score invented · Browser heuristic, not Claude eligibility · Network settings are not changed</text></g></svg>
