[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "publishops-crosscast"
version = "0.11.0"
description = "Multi-platform video release operations console"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
  "Pillow>=11,<14",
  "bili-agent==0.7.0",
  "google-api-python-client==2.201.0",
  "google-auth-oauthlib==1.5.0",
  "PySocks==1.7.1",
  "patchright==1.58.2",
  "loguru==0.7.3",
  "qrcode==8.2",
  "segno==1.6.6",
  "opencv-python==5.0.0.93",
]

[project.scripts]
vpub = "video_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

